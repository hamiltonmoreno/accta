# Compose canónico do Portal ACCTA (PostgreSQL/Supabase — SEM MongoDB).
#
# Esta é a referência versionada. Deve manter-se alinhada com o ficheiro
# gerido pelo Hostinger Docker Manager (/docker/accta/docker-compose.yml).
# NÃO deve existir uma cópia divergente em /opt/projetos/accta/docker-compose.yml
# (foi essa cópia órfã, da era Mongo, que causou o incidente do `MONGO_URL`).
#
# `backend/.env` TEM de conter `DATABASE_URL` (URI do connection pooler do
# Supabase, porta 6543, transaction mode). Sem ela o backend aborta no
# arranque com `RuntimeError: DATABASE_URL environment variable is required`.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: accta-backend:latest
    container_name: accta-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # Porta 8000 = porta interna do container em produção (decisão do dono;
    # ver backend/Dockerfile e deploy.yml). Em prod o NPM alcança o backend
    # pela rede `proxy` (sem mapeamento de host); este mapeamento serve o
    # uso local/de referência.
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount no host (NÃO volume nomeado): o nginx serve /uploads/
      # directamente do disco (mais rápido que proxy→uvicorn) e a pasta entra
      # na rotina de backup. O container corre como root (Dockerfile sem USER),
      # logo os ficheiros ficam root:root — a pasta no host deve ser 755 para o
      # nginx (www-data) os conseguir ler.
      #
      # ⚠️ MIGRAÇÃO ONE-TIME (ver HOSTINGER_DEPLOY.md §3): copiar os ficheiros
      # do volume nomeado antigo `accta-uploads` para /srv/accta/uploads ANTES
      # de recriar o container, senão os uploads existentes desaparecem.
      - /srv/accta/uploads:/app/uploads
