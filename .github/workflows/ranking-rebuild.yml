name: Ranking — Rebuild snapshot (cron)

# Recalcula o snapshot do ranking de atuação do socio (spec-ranking-socio F5).
# Corre `scripts/rebuild_ranking.py` num runner GH em vez de cron no VPS — assim
# nao depende de SSH/systemd e o agendamento e versionado.
#
# Requer 1 secret no repositorio: RANKING_REBUILD_DATABASE_URL
#   - DATABASE_URL de PRODUCAO (Supabase pooler, porta 6543, transaction mode).
#   - O role tem de manter BYPASSRLS (postura RLS da app).
#
# Para testar manualmente: Actions → "Ranking — Rebuild snapshot (cron)" → Run workflow.

on:
  schedule:
    # Diario 03:00 UTC (= 02:00 hora de Cabo Verde, fora do pico).
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      periods:
        description: 'Periodos a recalcular (espaco-separado; vazio = ano atual + "all")'
        required: false
        default: ''

concurrency:
  group: ranking-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild ranking snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild snapshot
        env:
          DATABASE_URL: ${{ secrets.RANKING_REBUILD_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret RANKING_REBUILD_DATABASE_URL nao configurado."
            exit 1
          fi
          python scripts/rebuild_ranking.py ${{ github.event.inputs.periods }}
