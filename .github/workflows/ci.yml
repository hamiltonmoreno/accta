name: CI — Lint, Build & Test

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ──────────────────────────────────────────────
  # BACKEND — Python / FastAPI
  # ──────────────────────────────────────────────
  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/accta_test
      SECRET_KEY: ci-test-secret-key-not-for-production
      CORS_ORIGINS: '*'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff httpx

      - name: Lint (ruff)
        run: ruff check .

      - name: Run smoke tests
        run: pytest tests/test_smoke.py -v --tb=short

      - name: Run unit tests with coverage
        # Pure unit tests (mocked DB) — fast, deterministic, do not require Mongo.
        run: |
          pytest \
            tests/test_auth_unit.py \
            tests/test_finances_edge_cases.py \
            tests/test_rbac_matrix.py \
            --cov=auth --cov=models --cov=helpers --cov=routes \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=20 \
            -W ignore::DeprecationWarning

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # FRONTEND — React / Craco
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      REACT_APP_BACKEND_URL: https://placeholder.example.com
      CI: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint (eslint)
        run: npx eslint src/ --ext .js,.jsx --max-warnings=60 --no-error-on-unmatched-pattern

      - name: Unit tests
        run: yarn test
        env:
          CI: 'true'

      - name: Build
        run: yarn build
        env:
          GENERATE_SOURCEMAP: false
