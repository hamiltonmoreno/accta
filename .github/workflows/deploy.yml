name: CD — Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ──────────────────────────────────────────────
  # CI GATE — Lint + build must pass before deploy
  # ──────────────────────────────────────────────
  backend-check:
    name: Backend CI Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install & lint
        run: |
          pip install -r requirements.txt
          pip install ruff
          ruff check .

  frontend-check:
    name: Frontend CI Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      REACT_APP_BACKEND_URL: https://placeholder.example.com
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache yarn
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            ~/.cache/yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install, lint & build
        run: |
          yarn install --frozen-lockfile
          npx eslint src/ --ext .js,.jsx --max-warnings=60 --no-error-on-unmatched-pattern
          yarn build
        env:
          GENERATE_SOURCEMAP: false

  # ──────────────────────────────────────────────
  # DEPLOY — Runs after CI gate passes
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            APP_DIR=${{ secrets.DEPLOY_APP_DIR || '/app' }}
            cd $APP_DIR

            echo "── Pulling latest code ──"
            git pull origin main

            echo "── Backend: Install dependencies ──"
            cd $APP_DIR/backend
            ./venv/bin/pip install -r requirements.txt --quiet

            echo "── Frontend: Build ──"
            cd $APP_DIR/frontend
            yarn install --frozen-lockfile
            REACT_APP_BACKEND_URL=${{ secrets.PRODUCTION_URL }} yarn build

            echo "── Restart services ──"
            sudo supervisorctl restart backend

            echo "── Reload Nginx (serves built frontend) ──"
            sudo systemctl reload nginx

            echo "── Health check ──"
            sleep 5
            curl -sf http://localhost:8001/api/ > /dev/null && echo "Backend: OK" || { echo "Backend: FAIL"; exit 1; }
            echo "Deploy complete!"

      - name: Deploy summary
        if: success()
        run: |
          echo "## Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed to:** ${{ secrets.PRODUCTION_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
