# ─────────────────────────────────────────────────────────────────────────────
# Portal ACCTA — Nginx reverse proxy (REFERÊNCIA VERSIONADA)
#
# Espelho de /etc/nginx/sites-available/accta no VPS. Manter os dois em sync.
# Instalação:
#   sudo cp deploy/nginx/accta.conf /etc/nginx/sites-available/accta
#   sudo ln -sf /etc/nginx/sites-available/accta /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Arquitetura: backend em Docker Compose (serviço `accta-backend`) exposto em
# 127.0.0.1:8001. Uploads públicos servidos pelo nginx directamente do disco
# (bind-mount /srv/accta/uploads); `documents` ficam atrás da API (RBAC).
#
# ⚠️ HTTPS é OBRIGATÓRIO: o backend usa cookie de sessão SameSite=None+Secure —
# sem TLS o browser não envia o cookie e o login parte. Este ficheiro é o
# baseline HTTP; correr `sudo certbot --nginx -d controlador.cv -d
# www.controlador.cv` (o certbot reescreve este server block: adiciona o
# listen 443 + cert e o redirect 80→443). Renovação automática via
# certbot.timer.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;
    server_name controlador.cv www.controlador.cv;

    # 12M = folga acima da maior categoria de upload (documents, 10MB).
    # Se o limite por categoria subir no backend (routes/upload.py), subir aqui também.
    client_max_body_size 12M;

    # ── API → backend (SSE-friendly: sem buffering, read timeout longo) ──
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        # Headers explícitos (não usar `include proxy_params` — só existe em
        # Debian/Ubuntu; isto funciona em qualquer distro).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (notificações em tempo real) — não terminar a ligação aos ~60s.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # ── Documentos: NUNCA servir do disco ──
    # RBAC dos documentos é feito em /api/documents/{id}/download. Espelha
    # UploadsStaticFiles (backend/server.py) para o caso de acesso directo
    # via URL adivinhada. `^~` garante prioridade sobre regex e sobre /uploads/.
    location ^~ /uploads/documents/ {
        return 404;
    }

    # ── Uploads públicos (avatars, logos, proofs, gallery) ──
    # Servidos pelo nginx directamente do bind-mount — liberta o worker uvicorn.
    location ^~ /uploads/ {
        alias /srv/accta/uploads/;
        expires 7d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        # NB: NÃO forçar Content-Disposition: attachment aqui — logos/avatars
        # precisam de render inline. `nosniff` já previne MIME-confusion.
        try_files $uri =404;
        access_log off;
    }

    # ── Frontend (build estático React) ──
    # Ajustar `root` se o build não estiver em /app/frontend/build no host.
    location / {
        root /app/frontend/build;
        try_files $uri /index.html;
    }
}
